<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3d1f">
<title>Argo Tookee - Smart Timbangan Sawit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="latar.jpg">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;color:#fff;background:#06280f;min-height:100vh;min-height:100dvh;position:relative;isolation:isolate;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url(latar.jpg) 72% 50%/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(3,34,14,.82) 0%,rgba(3,34,14,.5) 42%,rgba(3,34,14,.05) 80%),linear-gradient(0deg,rgba(3,34,14,.55),transparent 45%)}
.stage{width:min(100%,1120px);min-height:100vh;min-height:100dvh;margin:0 auto;padding:calc(5vh + env(safe-area-inset-top)) 5vw calc(4vh + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.hero{width:min(100%,720px);container-type:inline-size;display:flex;align-items:flex-start}
.hero>svg{width:12.3cqw;flex:none;margin:1cqw 3cqw 0 0}
.hero p{font-size:max(13px,4.1cqw);font-weight:600;line-height:1.2}
.hero h1{font-size:max(34px,12.6cqw);font-weight:800;line-height:1;letter-spacing:-.025em}
.hero h1 i{font-style:normal;background:linear-gradient(180deg,#8bf53a,#1fb84a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h2{font-size:max(16px,5.9cqw);font-weight:600;line-height:1.15;margin-top:.8cqw}
.hero em{display:inline-block;font-size:max(12px,3.9cqw);font-weight:500;margin-top:2.6cqw;padding:.9cqw 3.4cqw;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35)}
.hero em b{font-weight:400;margin:0 2.2cqw}
/* ===== TIMBUL (emboss 3D) ===== */
.hero>svg,.hero p,.hero h1,.hero h2,.hero em{width:fit-content;cursor:pointer;user-select:none;-webkit-user-select:none}
.hero>svg{width:12.3cqw;filter:drop-shadow(-1px -1px 0 rgba(255,255,255,.6)) drop-shadow(1px 1px 0 #0a4a1a) drop-shadow(2px 2px 0 #0a4a1a) drop-shadow(3px 4px 0 #083814) drop-shadow(4px 6px 0 #062a0e) drop-shadow(0 14px 14px rgba(0,0,0,.6))}
.hero h1{filter:drop-shadow(-1px -1px 0 rgba(255,255,255,.5)) drop-shadow(1px 1px 0 #0a4a1a) drop-shadow(2px 2px 0 #0a4a1a) drop-shadow(3px 3px 0 #083814) drop-shadow(4px 5px 0 #083814) drop-shadow(5px 7px 0 #062a0e) drop-shadow(0 16px 16px rgba(0,0,0,.6))}
.hero h2,.hero p{text-shadow:-1px -1px 0 rgba(255,255,255,.45),1px 1px 0 #0a4a1a,2px 2px 0 #083814,3px 4px 0 #062a0e,0 9px 10px rgba(0,0,0,.55)}
.hero em{box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.25),0 5px 0 #062a0e,0 11px 14px rgba(0,0,0,.5);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 22px;padding-bottom:8px}
.c{--c1:#62e520;--c2:#0b952a;--c3:#066018;position:relative;container-type:inline-size;display:flex;align-items:center;aspect-ratio:var(--ar);color:#fff;text-decoration:none;border-radius:5.1%/15.1%;border:1.5px solid rgba(255,255,255,.6);background:radial-gradient(90% 120% at 0% 0%,rgba(255,255,255,.32),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.2),transparent 45%),linear-gradient(135deg,var(--c1),var(--c2));box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -5px 8px rgba(0,0,0,.28),0 6px 0 var(--c3),0 8px 0 rgba(0,0,0,.4),0 20px 30px rgba(0,0,0,.55);transition:transform .12s,box-shadow .12s,filter .2s}
.c:hover{filter:brightness(1.07)}
.c:active{transform:translateY(6px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.3),0 0 0 var(--c3),0 2px 0 rgba(0,0,0,.4),0 6px 10px rgba(0,0,0,.45)}
.c:focus-visible{outline:3px solid #fff;outline-offset:4px}
.ic{flex:0 0 32.7%;display:grid;place-items:center;position:relative}
.ic::after{content:"";position:absolute;right:0;top:27%;height:46%;width:3px;border-radius:2px;background:rgba(255,255,255,.55);box-shadow:1px 1px 0 rgba(0,0,0,.3)}
.ic svg{width:18.4cqw;height:18.4cqw;filter:drop-shadow(-1px -1px 0 rgba(255,255,255,.55)) drop-shadow(1px 2px 0 rgba(0,0,0,.35)) drop-shadow(2px 4px 0 rgba(0,0,0,.25)) drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.tx{flex:1;min-width:0;padding-left:5.6cqw;text-shadow:0 1px 0 rgba(255,255,255,.3),1px 2px 0 rgba(0,0,0,.4),0 4px 6px rgba(0,0,0,.3)}
.tx h3{font-size:max(17px,6.6cqw);font-weight:700;line-height:1.1}
.tx h3 small{display:block;font-size:max(13px,4.5cqw);font-weight:600;line-height:1.25}
.tx p{font-size:max(11.5px,3.5cqw);font-weight:500;line-height:1.4;margin-top:1.8cqw}
.go{flex:none;width:4.6cqw;min-width:14px;margin:0 5cqw 0 2cqw;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.4))}
.smart{--c1:#62e520;--c2:#0b952a;--c3:#055a17}.supir{--c1:#12bfff;--c2:#0a50d2;--c3:#073a95}.pantau{--c1:#ffbe1f;--c2:#f27a00;--c3:#a14d00}.lisensi{--c1:#ad85ff;--c2:#5a28d6;--c3:#3b1a95}
.smart{--ar:545/185}.supir{--ar:545/185}.pantau{--ar:545/190}.lisensi{--ar:545/190}
/* ===== getar saat disentuh ===== */
.shake{animation:getar .55s cubic-bezier(.36,.07,.19,.97) both}
@keyframes getar{0%,100%{transform:translate(0,0) rotate(0)}10%{transform:translate(-5px,2px) rotate(-2.5deg)}20%{transform:translate(6px,-2px) rotate(2.5deg)}30%{transform:translate(-6px,3px) rotate(-2deg)}40%{transform:translate(5px,-3px) rotate(2deg)}50%{transform:translate(-4px,2px) rotate(-1.5deg)}60%{transform:translate(4px,-1px) rotate(1.5deg)}70%{transform:translate(-3px,1px) rotate(-1deg)}80%{transform:translate(2px,0) rotate(.8deg)}90%{transform:translate(-1px,0) rotate(-.4deg)}}
@media (max-width:760px),(max-aspect-ratio:1/1){
 body::before{background-position:76% 30%}
 body::after{background:linear-gradient(180deg,rgba(3,34,14,.8) 0%,rgba(3,34,14,.5) 45%,rgba(3,34,14,.35) 100%)}
 .stage{justify-content:flex-start;gap:26px}
 .cards{grid-template-columns:1fr;max-width:540px;width:100%;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<main class="stage">
<section class="hero"><svg viewBox="0 0 60 100" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cf23a"/><stop offset="1" stop-color="#14a844"/></linearGradient></defs><path d="M34 2C12 22 4 56 18 98c4-26 34-44 40-80C50 10 42 4 34 2z" fill="url(#lg)"/><path d="M14 40C4 52 2 72 10 94c0-16 6-30 16-42z" fill="#2cc24c" opacity=".85"/><path d="M34 14C26 44 22 66 20 92" fill="none" stroke="#0e7a30" stroke-width="1.6" opacity=".55"/></svg><div><p>Selamat Datang di</p><h1>Argo <i>Tookee</i></h1></div></section>
<nav class="cards" aria-label="Pilih aplikasi">
<a class="c smart" style="--i:1" href="smart/" aria-label="Smart (Petugas)"><span class="ic"><svg viewBox="0 0 64 64"><path d="M9 24h46l4 30c0 2-1 3-3 3H8c-2 0-3-1-3-3z" fill="#fff"/><rect x="14" y="8" width="36" height="13" rx="3" fill="#fff"/><g fill="#18a33a"><rect x="24" y="12" width="4" height="4" rx="1"/><rect x="30" y="12" width="4" height="4" rx="1"/><rect x="36" y="12" width="4" height="4" rx="1"/></g><circle cx="32" cy="40" r="11" fill="#12973a"/><g fill="#fff"><circle cx="32" cy="34" r="2.2"/><circle cx="28" cy="38" r="2.2"/><circle cx="36" cy="38" r="2.2"/><circle cx="30" cy="43" r="2.2"/><circle cx="34" cy="43" r="2.2"/><circle cx="32" cy="47" r="2"/></g></svg></span><span class="tx"><h3>Smart<small>(Petugas)</small></h3><p>Input dan proses<br>penimbangan TBS &amp; brondolan</p></span><svg class="go" viewBox="0 0 24 24"><path d="M8 3l9 9-9 9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<a class="c supir" href="supir/" aria-label="Supir"><span class="ic"><svg viewBox="0 0 64 64"><path d="M19 21c0-8 5-13 13-13s13 5 13 13z" fill="#fff"/><rect x="14" y="20" width="36" height="6" rx="3" fill="#fff"/><circle cx="32" cy="34" r="8" fill="#fff"/><path d="M6 60c0-14 9-21 26-21s26 7 26 21z" fill="#fff"/><circle cx="32" cy="52" r="8.5" fill="none" stroke="#0a63e0" stroke-width="3"/><path d="M32 43v9M23.5 52h17" stroke="#0a63e0" stroke-width="3"/></svg></span><span class="tx"><h3>Supir</h3><p>Informasi armada<br>dan perjalanan</p></span><svg class="go" viewBox="0 0 24 24"><path d="M8 3l9 9-9 9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<a class="c pantau" href="pantau/" aria-label="Pantau (Pemilik)"><span class="ic"><svg viewBox="0 0 64 64"><circle cx="19" cy="17" r="9" fill="#fff"/><path d="M3 54c0-15 7-23 16-23s16 8 16 23z" fill="#fff"/><path d="M19 31l-4 8 4 6 4-6z" fill="#f08a05"/><path d="M38 56V42h6v14zM47 56V32h6v24zM56 56V22h5v34z" fill="#fff"/><path d="M37 28l8-8 6 4 9-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 10h8v8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="tx"><h3>Pantau<small>(Pemilik)</small></h3><p>Pantau transaksi, tonase,<br>omzet dan keuntungan</p></span><svg class="go" viewBox="0 0 24 24"><path d="M8 3l9 9-9 9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<a class="c lisensi" href="key/" aria-label="Lisensi"><span class="ic"><svg viewBox="0 0 64 64"><path d="M10 4h30l12 12v40H10z" fill="#fff"/><path d="M40 4v12h12z" fill="#d9ccff"/><path d="M18 24h22M18 32h28M18 40h14" stroke="#5a2fd0" stroke-width="3" stroke-linecap="round"/><path d="M46 38l13 4v10c0 7-6 11-13 14-7-3-13-7-13-14V42z" fill="#5a2fd0" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M40 52l4 4 8-9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="tx"><h3>Lisensi</h3><p>Aktivasi dan status<br>lisensi aplikasi</p></span><svg class="go" viewBox="0 0 24 24"><path d="M8 3l9 9-9 9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</nav>
</main>
<script>
(function(){
 document.querySelectorAll('.hero>svg,.hero p,.hero h1,.hero h2,.hero em').forEach(function(el){
  el.addEventListener('pointerdown',function(){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');try{navigator.vibrate&&navigator.vibrate([25,20,25])}catch(e){}});
  el.addEventListener('animationend',function(e){if(e.animationName==='getar')el.classList.remove('shake')});
 });
 document.querySelectorAll('.c').forEach(function(a){a.addEventListener('pointerdown',function(){try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}})});
})();
</script>
</body></html>
